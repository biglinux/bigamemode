name: Package check

# The package build and every check of build-package.yml, for pull requests
# and manual runs of any branch. Under this name a successful run is not
# handed to the BigLinux package builders, which act on "Build Package"
# runs only (see build-package.yml). See docs/ci-workflows-audit.md.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/build-package.yml
