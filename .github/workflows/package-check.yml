name: Package check

# Everything build-package.yml runs (the code's checks of backend-tests.yml
# and the package), for pull requests and manual runs of any branch, as one
# run. Under this name a successful run is not handed to the BigLinux package
# builders, which act on "Build Package" runs only (see build-package.yml).
# See docs/CI.md.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/build-package.yml
