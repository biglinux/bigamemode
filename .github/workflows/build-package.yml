name: Build Package

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # --init: check() runs launcher's terminate test, which needs a PID 1 that
    # reaps orphans, as systemd does; the container's default `tail` does not.
    container:
      image: archlinux:base-devel
      options: --init
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Install package build dependencies
        run: |
          pacman -Syu --noconfirm --needed git sudo namcap desktop-file-utils gettext appstream
          useradd -m builder
          # makepkg --syncdeps installs the recipe's own depends and makedepends.
          echo 'builder ALL=(root) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the checked-out sources
        run: |
          # pkgbuild/PKGBUILD fetches main from GitHub; here it builds this
          # commit's files instead, everything else in the recipe unchanged.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir package-build
          git ls-files -z | tar --null --transform='s,^,bigame-mode/,' \
            -T - -czf package-build/source.tar.gz
          cp pkgbuild/PKGBUILD pkgbuild/bigame-mode.install package-build/
          printf '\nsource=(source.tar.gz)\nsha256sums=(%s)\n' \
            "$(sha256sum package-build/source.tar.gz | cut -d ' ' -f 1)" >> package-build/PKGBUILD
          chown -R builder:builder package-build
          runuser -u builder -- bash -c 'cd package-build && makepkg --syncdeps --cleanbuild --noconfirm'
      - name: Validate the built package
        run: |
          # The package itself: Arch's makepkg.conf also builds bigame-mode-debug.
          package=$(find package-build -maxdepth 1 -name 'bigame-mode-[0-9]*.pkg.tar.zst' -print -quit)
          test -n "$package"
          namcap package-build/PKGBUILD "$package" | tee package-build/namcap.log
          if grep -q ' E: ' package-build/namcap.log; then exit 1; fi
          mkdir package-build/installed
          tar -xf "$package" -C package-build/installed
          desktop-file-validate package-build/installed/usr/share/applications/*.desktop
          test -x package-build/installed/usr/bin/bigame-ui
          test -x package-build/installed/usr/bin/bigame-daemon
          test -s package-build/installed/usr/lib/systemd/system/bigame-daemon.service
          test -s package-build/installed/usr/share/polkit-1/actions/com.biglinux.BiGameMode.policy
          test -s package-build/installed/usr/share/locale/pt_BR/LC_MESSAGES/bigame-mode.mo
          test -s package-build/installed/usr/share/licenses/bigame-mode/LICENSE
          appstreamcli validate --no-net package-build/installed/usr/share/metainfo/*.xml
          grep -q 'https://github.com/biglinux/bigamemode' package-build/installed/usr/share/metainfo/*.xml
          version=$(grep -m1 '^version' bigame-engine/Cargo.toml | cut -d '"' -f 2)
          test "$(pacman -Qp "$package" | cut -d ' ' -f 2)" = "$version-$(sed -n 's/^pkgrel=//p' pkgbuild/PKGBUILD)"
          sha256sum "$package" > package-build/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: package-${{ github.sha }}
          path: |
            package-build/bigame-mode-*.pkg.tar.zst
            package-build/namcap.log
            package-build/SHA256SUMS
          if-no-files-found: error
