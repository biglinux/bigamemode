name: Build Package

# Builds the commit under test with pkgbuild/PKGBUILD, in Arch's own
# container, validates the package and keeps it as an artifact. Beside it,
# backend-tests.yml checks the code: one run per push or pull request, with
# both jobs.
#
# This workflow's success is what the BigLinux package builders act on: when
# a "Build Package" run of biglinux/bigamemode ends in success, they build
# its branch (on GitLab, gitlab.bigib.org/builder/packagebuilder). So it runs
# only for the branches they can build: pushes to main, testing-* and
# stable-*, and manual runs of such a branch. A failed run is not built, and
# a branch with '/' breaks their recipe, so pull requests are checked by
# package-check.yml, which calls this workflow under another name.
# See docs/CI.md.

on:
  push:
    # '*' does not match '/': main, testing-*, stable-* and other plain
    # branch names. Topic branches (fix/…, feat/…) go through their pull
    # request, in package-check.yml.
    branches: ['*']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when package-check.yml calls this
  # one, so a pull request's check never queues behind a push of its branch.
  group: build-package-${{ github.workflow }}-${{ github.ref }}
  # A newer commit on a pull request makes the older check moot. Pushes are
  # never cancelled: each successful one is built by the BigLinux builders.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The code's checks, in parallel with the package. A run is successful,
  # and so handed to the BigLinux builders, only when both pass.
  rust:
    uses: ./.github/workflows/backend-tests.yml

  package:
    name: Build and validate the Arch package
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
      # check() runs launcher's terminate test, which needs a PID 1 that
      # reaps orphans, as systemd does; the container's default one does not.
      options: --init
    timeout-minutes: 45
    defaults:
      run:
        # bash -eo pipefail: a failing command, or any stage of a pipe into
        # tee, fails the step.
        shell: bash
    steps:
      - name: Refuse a branch the BigLinux builders cannot build
        # A manual "Build Package" run that succeeds is built by them too,
        # and their recipe breaks on '/' in a branch name. Run
        # package-check.yml on such a branch instead.
        if: github.workflow == 'Build Package' && contains(github.ref_name, '/')
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "::error::$BRANCH has '/' in its name: a successful Build Package run is handed to the BigLinux builders, which cannot build it. Run Package check on it instead."
          exit 1

      - name: Prepare Arch environment
        run: |
          set -Eeuo pipefail
          # git for a real checkout (git archive); the rest for the checks.
          # makepkg --syncdeps installs the recipe's depends and makedepends.
          pacman -Syu --noconfirm --needed git namcap desktop-file-utils appstream libxml2 qemu-user
          useradd --create-home builder
          # makepkg refuses root. The build user may run pacman, and only
          # pacman, through sudo, which --syncdeps needs.
          echo 'builder ALL=(root) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          visudo -cf /etc/sudoers.d/builder

      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the PKGBUILD for this commit
        id: source
        run: |
          set -Eeuo pipefail
          # For a pull request, GITHUB_SHA is the merge commit actions/checkout
          # checked out; for a push, the pushed commit.
          head=$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "::error::checked out $head, but this run is for $GITHUB_SHA"
            exit 1
          fi
          chown -R builder:builder "$GITHUB_WORKSPACE"
          # The recipe as committed, its git source replaced by this commit.
          runuser -u builder -- .github/scripts/prepare-package-source.sh package-build

      - name: Build Arch package
        id: build
        working-directory: package-build
        # The recipe's own prepare(), build(), check() and package(): the LTO
        # release build and the test suite in release mode, as the BigLinux
        # builders run them. --log keeps each stage's output beside it.
        run: runuser -u builder -- makepkg --syncdeps --cleanbuild --noconfirm --log

      - name: Identify the built packages
        id: packages
        working-directory: package-build
        run: |
          set -Eeuo pipefail
          pkgname=$(runuser -u builder -- makepkg --printsrcinfo | sed -n 's/^pkgname = //p')
          # makepkg's own list rather than a glob: Arch's makepkg.conf also
          # builds <pkgname>-debug, and a glob could take one for the other.
          mapfile -t built < <(runuser -u builder -- makepkg --packagelist)
          main='' debug=''
          for path in "${built[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "::error::makepkg lists $path, but it was not built"
              exit 1
            fi
            name=$(pacman -Qpq "$path")
            case "$name" in
              "$pkgname") main=$(basename "$path") ;;
              "$pkgname-debug") debug=$(basename "$path") ;;
              *) echo "::error::unexpected package $name"; exit 1 ;;
            esac
          done
          if [[ -z "$main" ]]; then
            echo "::error::no $pkgname package was built"
            exit 1
          fi
          echo "Package:       $main"
          echo "Debug package: ${debug:-none}"
          {
            echo "pkgname=$pkgname"
            echo "main=$main"
            echo "debug=$debug"
          } >> "$GITHUB_OUTPUT"

      - name: Validate package metadata
        id: metadata
        working-directory: package-build
        env:
          PACKAGE: ${{ steps.packages.outputs.main }}
          PKGNAME: ${{ steps.packages.outputs.pkgname }}
        run: |
          set -Eeuo pipefail
          LC_ALL=C pacman -Qip "$PACKAGE" | tee package-info.txt
          pacman -Qlp "$PACKAGE" > package-files.txt
          srcinfo=$(runuser -u builder -- makepkg --printsrcinfo)
          field() { sed -n "s/^[[:space:]]$1 = //p" <<<"$srcinfo" | head -n 1; }
          epoch=$(field epoch)
          version="${epoch:+$epoch:}$(field pkgver)-$(field pkgrel)"
          arch=$(field arch)
          cargo=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\([^"]*\)".*/\1/p' ../bigame-engine/Cargo.toml)
          appstream=$(grep -o -m 1 '<release version="[^"]*"' ../data/com.biglinux.BiGameMode.metainfo.xml | cut -d '"' -f 2)
          built_arch=$(sed -n 's/^Architecture *: //p' package-info.txt)
          failed=0
          check() {
            if [[ "$2" == "$3" ]]; then
              printf '  ok    %-28s %s\n' "$1" "$2"
            else
              printf '  FAIL  %-28s %s, expected %s\n' "$1" "$2" "$3"
              failed=1
            fi
          }
          check 'package name and version' "$(pacman -Qp "$PACKAGE")" "$PKGNAME $version"
          check 'architecture' "$built_arch" "$arch"
          check 'Cargo workspace version' "$cargo" "$(field pkgver)"
          check 'newest AppStream release' "$appstream" "$(field pkgver)"
          echo "  $(wc -l < package-files.txt) entries in the package (package-files.txt)"
          if (( failed )); then
            echo "::error::the package's version or architecture disagrees with the sources"
            exit 1
          fi
          {
            echo "version=$version"
            # An artifact name cannot hold the ':' of an epoch.
            echo "artifact=bigame-mode-${version//:/.}-${GITHUB_SHA:0:12}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate package contents
        id: contents
        env:
          PACKAGE: ${{ steps.packages.outputs.main }}
        run: .github/scripts/check-package-contents.sh "package-build/$PACKAGE" package-build/package-root

      - name: Check CPU compatibility (legacy x86-64)
        id: cpu
        run: |
          set -Eeuo pipefail
          root=package-build/package-root
          # What the binaries could ask of a processor, for the log: Rust's
          # std and memchr keep AVX2 paths they take only after a CPUID
          # check, so newer instructions are expected here and decide nothing.
          for bin in bigame-ui bigame-daemon; do
            python3 .github/scripts/x86-64-isa-report.py "$root/usr/bin/$bin"
          done
          # What decides: the packaged binaries, run on emulated processors
          # from the x86-64 baseline (2003) up to a current AMD part.
          runuser -u builder -- .github/scripts/legacy-cpu-test.sh \
            "$root/usr/bin/bigame-ui" "$root/usr/bin/bigame-daemon"

      - name: Validate desktop entry
        id: desktop
        # The installed entry, with every catalogue merged in by msgfmt.
        run: desktop-file-validate package-build/package-root/usr/share/applications/com.biglinux.BiGameMode.desktop

      - name: Validate AppStream metadata
        id: appstream
        run: |
          set -Eeuo pipefail
          metainfo=package-build/package-root/usr/share/metainfo/com.biglinux.BiGameMode.metainfo.xml
          appstreamcli validate --no-net --explain "$metainfo"
          # Every project address is this repository, not a fork or an
          # earlier home.
          failed=0
          while IFS= read -r url; do
            if [[ "$url" == https://github.com/biglinux/bigamemode || "$url" == https://github.com/biglinux/bigamemode/* ]]; then
              echo "  ok    $url"
            else
              echo "  FAIL  $url is not https://github.com/biglinux/bigamemode"
              failed=1
            fi
          done < <(sed -n 's:.*<url type="[^"]*">\(.*\)</url>.*:\1:p' "$metainfo")
          (( ! failed ))

      - name: Run namcap
        id: namcap
        working-directory: package-build
        env:
          PACKAGE: ${{ steps.packages.outputs.main }}
        run: |
          set -Eeuo pipefail
          # The real recipe, not the CI copy with its source override, and
          # the package (not the debug package, whose build-id links point
          # into the package by design).
          namcap ../pkgbuild/PKGBUILD "$PACKAGE" | tee namcap.log
          count() { awk -v tag=" $1: " 'index($0, tag) { n++ } END { print n + 0 }' namcap.log; }
          errors=$(count E) warnings=$(count W)
          echo "errors=$errors" >> "$GITHUB_OUTPUT"
          echo "warnings=$warnings" >> "$GITHUB_OUTPUT"
          # Errors fail the build. Warnings are reviewed in
          # docs/CI.md and shown in the run summary: the
          # owned empty directories, libraries GTK already pulls in, and
          # programs or services the package runs rather than links.
          if (( errors )); then
            echo "::error::namcap reported $errors error(s); see namcap.log"
            exit 1
          fi

      - name: Write SHA256SUMS
        id: checksums
        working-directory: package-build
        env:
          PACKAGE: ${{ steps.packages.outputs.main }}
          DEBUG_PACKAGE: ${{ steps.packages.outputs.debug }}
        run: |
          set -Eeuo pipefail
          sha256sum -- "$PACKAGE" ${DEBUG_PACKAGE:+"$DEBUG_PACKAGE"} | tee SHA256SUMS

      - name: Write build report
        if: ${{ !cancelled() }}
        env:
          SOURCE: ${{ steps.source.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PACKAGES: ${{ steps.packages.outcome }}
          METADATA: ${{ steps.metadata.outcome }}
          CONTENTS: ${{ steps.contents.outcome }}
          CPU: ${{ steps.cpu.outcome }}
          DESKTOP: ${{ steps.desktop.outcome }}
          APPSTREAM: ${{ steps.appstream.outcome }}
          NAMCAP: ${{ steps.namcap.outcome }}
          NAMCAP_ERRORS: ${{ steps.namcap.outputs.errors }}
          NAMCAP_WARNINGS: ${{ steps.namcap.outputs.warnings }}
          CHECKSUMS: ${{ steps.checksums.outcome }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -Eeuo pipefail
          result() {
            case "$1" in
              success) echo PASS ;; failure) echo FAIL ;; *) echo "not run" ;;
            esac
          }
          mkdir -p package-build
          {
            echo '## Big Game Mode package build'
            echo
            echo "Commit \`$GITHUB_SHA\`${VERSION:+, bigame-mode $VERSION}"
            echo
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| PKGBUILD prepared for this commit | $(result "$SOURCE") |"
            echo "| makepkg (build, check, package) | $(result "$BUILD") |"
            echo "| Package and debug package identified | $(result "$PACKAGES") |"
            echo "| Package metadata and versions | $(result "$METADATA") |"
            echo "| Package contents | $(result "$CONTENTS") |"
            echo "| Runs on x86-64 baseline to v3 CPUs (QEMU) | $(result "$CPU") |"
            echo "| Desktop entry | $(result "$DESKTOP") |"
            echo "| AppStream metadata | $(result "$APPSTREAM") |"
            echo "| namcap${NAMCAP_ERRORS:+ ($NAMCAP_ERRORS errors, $NAMCAP_WARNINGS warnings)} | $(result "$NAMCAP") |"
            echo "| SHA256SUMS | $(result "$CHECKSUMS") |"
            if [[ -s package-build/SHA256SUMS ]]; then
              echo
              echo '```'
              cat package-build/SHA256SUMS
              echo '```'
            fi
            if [[ -s package-build/namcap.log ]]; then
              echo
              echo '<details><summary>namcap</summary>'
              echo
              echo '```'
              cat package-build/namcap.log
              echo '```'
              echo '</details>'
            fi
          } | tee package-build/build-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact }}
          # The package and its debug package, their checksums, namcap's
          # report, the package's file list and the makepkg logs.
          path: |
            package-build/*.pkg.tar.zst
            package-build/SHA256SUMS
            package-build/package-info.txt
            package-build/package-files.txt
            package-build/build-report.md
            package-build/*.log
          if-no-files-found: error
          # A re-run of this job replaces the attempt before it.
          overwrite: true
          retention-days: 30

      # Only after a failure, and never an error of its own: the step that
      # failed is the one to read, whatever logs exist are kept to help.
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bigame-mode-build-logs-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            package-build/*.log
            package-build/package-info.txt
            package-build/build-report.md
          if-no-files-found: ignore
          retention-days: 14
