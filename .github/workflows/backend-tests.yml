name: Backend tests

# The code: formatting, Clippy, the workspace's tests, rustdoc links, the
# privileged helper's authorization refusals and the translations. The
# package itself is build-package.yml's. See docs/ci-workflows-audit.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  # A newer commit on a pull request makes the older run moot; every commit
  # on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust workspace, helper authorization and translations
    runs-on: ubuntu-24.04
    # Arch's own repositories, the ones the package is built from.
    container:
      image: archlinux:base-devel
      # An init as PID 1 reaps orphans, as systemd does; the default one does
      # not, and a killed game's grandchild would linger as a zombie in its
      # process group (launcher's terminate test).
      options: --init
    timeout-minutes: 30
    defaults:
      run:
        # bash -eo pipefail: a failing command, or any stage of a pipe into
        # tee, fails the step.
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Prepare Arch environment
        run: |
          set -Eeuo pipefail
          # rust: cargo, rustfmt and Clippy. gtk4, libadwaita, glib2: what
          # bigame-ui links and its build script runs (glib-compile-resources).
          # dbus (and busctl, from the base image's systemd): the helper's
          # authorization test. python, gettext: the translations.
          pacman -Syu --noconfirm --needed git rust gtk4 libadwaita glib2 dbus python gettext
          useradd --create-home builder

      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Everything runs as an ordinary user, as makepkg's check() does: tests
      # of permission refusals (a read-only directory, a file the user owns)
      # pass under root for the wrong reason, or fail.
      - name: Hand the checkout to the build user
        id: setup
        run: |
          set -Eeuo pipefail
          chown -R builder:builder "$GITHUB_WORKSPACE"
          {
            printf 'Commit: '; runuser -u builder -- git rev-parse HEAD
            runuser -u builder -- rustc --version
            runuser -u builder -- cargo --version
            runuser -u builder -- cargo clippy --version
            runuser -u builder -- rustfmt --version
            echo
            pacman -Q
          } > ci-versions.log
          head -n 5 ci-versions.log

      # Each check below runs whenever the setup succeeded, so one run
      # reports every failing check, not only the first. Any failure still
      # fails the job.
      - name: Check Rust formatting
        id: fmt
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: bigame-engine
        run: runuser -u builder -- cargo fmt --all --check

      - name: Run Clippy
        id: clippy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: bigame-engine
        # clippy::assert_is_empty (new in Clippy 1.99) would turn the tests'
        # assert!(x.is_empty()) into assert_eq!(x, [] as [String; 0]); the
        # project keeps the former (README, Development). It is allowed here
        # rather than in Cargo.toml, where an older Clippy rejects the unknown
        # lint name. Arch's rust is the current stable release, so it exists.
        run: >-
          runuser -u builder -- cargo clippy --locked --workspace --all-targets --all-features
          -- -D warnings -A clippy::assert_is_empty

      - name: Run workspace tests
        id: tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: bigame-engine
        # No display and no session bus: no test opens a GTK window or talks
        # to D-Bus (the helper's bus test is the step after next).
        run: runuser -u builder -- cargo test --locked --workspace 2>&1 | tee ../cargo-test.log

      - name: Check Rust documentation
        id: doc
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: bigame-engine
        # -D warnings: every intra-doc link must resolve.
        run: runuser -u builder -- env RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps

      - name: Test helper authorization
        id: authorization
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -Eeuo pipefail
          # --workspace: the feature set the tests were built with, so only
          # the binary is linked, nothing rebuilt.
          runuser -u builder -- cargo build --locked --manifest-path bigame-engine/Cargo.toml \
            --workspace --bin bigame-daemon
          # On a private bus, as an ordinary user, with no Polkit: every
          # privileged method must be refused before it acts.
          runuser -u builder -- bash tests/daemon-authorization.sh \
            bigame-engine/target/debug/bigame-daemon 2>&1 | tee daemon-authorization.log

      - name: Validate translations
        id: translations
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -Eeuo pipefail
          # The template matches the sources, and LINGUAS lists every catalogue.
          runuser -u builder -- python3 locale/extract-strings.py --check
          count=0
          for po in locale/*.po; do
            msgfmt --check --check-format -o /dev/null "$po"
            count=$((count + 1))
          done
          echo "$count catalogues valid"

      - name: Write test summary
        if: ${{ !cancelled() }}
        env:
          FMT: ${{ steps.fmt.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          DOC: ${{ steps.doc.outcome }}
          AUTHORIZATION: ${{ steps.authorization.outcome }}
          TRANSLATIONS: ${{ steps.translations.outcome }}
        run: |
          set -Eeuo pipefail
          result() {
            case "$1" in
              success) echo PASS ;; failure) echo FAIL ;; *) echo "not run" ;;
            esac
          }
          # Totals for the reader only: cargo's exit status is what passes or
          # fails the tests, so a change in its output format cannot turn a
          # run red or green here.
          totals='not available'
          if [[ -s cargo-test.log ]]; then
            totals=$(sed 's/\x1b\[[0-9;]*m//g' cargo-test.log | grep -oE '[0-9]+ passed; [0-9]+ failed; [0-9]+ ignored' |
              awk '{ p += $1; f += $3; i += $5; n++ } END { if (n) printf "%d passed, %d failed, %d ignored", p, f, i }')
            totals=${totals:-not available}
          fi
          {
            echo '## Big Game Mode backend tests'
            echo
            echo "Commit \`$GITHUB_SHA\`, $(sed -n 2p ci-versions.log 2>/dev/null)"
            echo
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Rustfmt | $(result "$FMT") |"
            echo "| Clippy, warnings as errors | $(result "$CLIPPY") |"
            echo "| Workspace tests ($totals) | $(result "$TESTS") |"
            echo "| Rustdoc, warnings as errors | $(result "$DOC") |"
            echo "| Helper authorization | $(result "$AUTHORIZATION") |"
            echo "| Translations | $(result "$TRANSLATIONS") |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cargo-test.log
            daemon-authorization.log
            ci-versions.log
          # Logs are a help, not a check: an early failure leaves none, and
          # that must not add an error of its own.
          if-no-files-found: ignore
          retention-days: 14
