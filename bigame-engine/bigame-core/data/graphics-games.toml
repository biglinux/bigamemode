# AI Graphics game list: facts about particular games that detection cannot
# establish from their files. Detection stays the main source; an entry only
# adds to it. An entry is here only with evidence behind it — observed on
# BiGame-mode's test machines, not reported somewhere.
#
# Keys (all optional except one of steam_app_id / exe):
#   steam_app_id       Steam app id, as a string
#   exe                executable name, when the game is not a Steam game
#   api                "dx11" | "dx12" | "vulkan" — the API it renders with
#                      by default (the running game still wins)
#   prefer             "native" | "optiscaler" | "nothing" — for Recommended
#   block              a reason to never inject into this game
#   tested_optiscaler  the OptiScaler version it was checked with
#   bad_optiscaler     OptiScaler versions known to break this game
#   proxy              the DLL slot OptiScaler needs here, when not dxgi.dll
#   verified_gpu       the GPU family the entry was verified on
#   verified_proton    the Proton build it was verified with
#   notes              why, in a sentence the page shows
#   [game.input_setting]  the game's own switch for the upscaler OptiScaler
#                      takes over, which Apply turns on when it is off and
#                      Restore puts back: input ("xess" | "dlss" | "fsr"),
#                      registry (a key under HKEY_CURRENT_USER in the game's
#                      Proton prefix), value (a DWORD; 0 is off), on (what
#                      to write), exclusive (the game's other upscalers,
#                      set to 0 with it)
#
# Your own entries go in ~/.config/bigame-mode/graphics-games.toml, same
# format; an entry there replaces one here for the same game.

[[game]]
steam_app_id = "750920"            # Shadow of the Tomb Raider
api = "dx12"                       # VKD3D-Proton seen in the running game
tested_optiscaler = "0.9.4"        # XeSS input, FSR output; docs/BENCHMARKS.md
verified_gpu = "RDNA 4, GeForce GTX"
verified_proton = "Proton Experimental 11.0"
notes = "OptiScaler FSR from the game's XeSS measured +10.1 % on an RX 9060 XT and +12 % on a GTX 1050 Ti; the game's DX11 renderer is slower than DX12 under Proton"

# Its XeSS is off until chosen in its menu, and OptiScaler has nothing to take
# over until then. 3 is Quality: set here with the game closed, the next
# benchmark ran XeSS Quality through OptiScaler FSR 4 (2026-09-26).
[game.input_setting]
input = "xess"
registry = 'Software\Eidos Montreal\Shadow of the Tomb Raider\Graphics'
value = "XESS"
on = 3
exclusive = ["DLSS"]

[[game]]
steam_app_id = "1091500"           # Cyberpunk 2077
api = "dx12"                       # the game's only renderer since 2.0
verified_gpu = "RDNA 4"
verified_proton = "Proton Experimental 11.0"
notes = "ships FSR 3.1 through the FidelityFX API and offers FSR 4 in its menu; with Proton's FSR 4 provider in the prefix the game's own FSR is the shortest path on RDNA 4"
