<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  System bus policy for the BiGame-mode privileged helper.

  Authorization proper is done by Polkit inside bigame-daemon; this file is the
  outer layer. It is written as an explicit allow-list rather than a blanket
  "allow send_destination", so a future interface added to the object is not
  automatically exposed to every local uid the moment it is written.
-->
<busconfig>
  <!-- Only root may own the name and thus answer as the helper. -->
  <policy user="root">
    <allow own="com.biglinux.BiGameMode"/>
  </policy>

  <policy context="default">
    <!-- Deny by default; each interface below is then allowed explicitly. -->
    <deny send_destination="com.biglinux.BiGameMode"/>

    <allow send_destination="com.biglinux.BiGameMode"
           send_interface="com.biglinux.BiGameMode"/>

    <!-- Introspection and properties, so generic tooling still works. -->
    <allow send_destination="com.biglinux.BiGameMode"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="com.biglinux.BiGameMode"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="com.biglinux.BiGameMode"
           send_interface="org.freedesktop.DBus.Peer"/>

    <allow receive_sender="com.biglinux.BiGameMode"/>
  </policy>
</busconfig>
